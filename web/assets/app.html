<!doctype html>
<html lang="ru">
<head>

<title>TigerSB</title>
<link rel="stylesheet" href="static/app.css">
</head>
<body>

  <span id="who" class="muted"></span>

</header>
<main class="wrap">

    <h2>Этот сервер</h2>

      <dt>Роль</dt><dd id="role">—</dd>
      <dt>Домен</dt><dd id="domain">—</dd>

  <section class="card">
    <h2>Скоро здесь</h2>

      <li>Серверы и точки маршрутизации</li>
      <li>Подключения: gRPC, XHTTP, каскад, Yandex CDN, TUIC</li>

      <li>Пользователи, устройства и подписки</li>
      <li>Заглушка «Технические работы»</li>
    </ul>
  </section>

<script src="static/app.js"></script>

</html>
